apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.microservice.name }}
  namespace: {{ .Values.microservice.namespace }}
spec:
  replicas: {{ .Values.microservice.replicas }} # values of 1 is default
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.microservice.name }}
  template:
    metadata:
      app.kubernetes.io/name: {{ .Values.microservice.namespace }}
      app.kubernetes.io/component: frontend
      app.kubernetes.io/instance: {{ .Values.microservice.name }}
  spec:
    containers:
    - name: {{ .Values.microservice.name }}
      image: {{ .Values.workload.image }} # image name from docker hub
      # if your UI also has endpint to check for healthz and readiness then add them as required
      livenessProbe: # app sends 200 reponse, healthy. 500 response then not healthy (atleast 1 negative then).
        httpGet:
          path: /healthz
          port: {{ .Values.workload.port }}
        initialDelaySeconds: {{ .Values.workload.livenessDelay }} # while the app is booting up, then would throw error. Giving application time to startup.
        periodSeconds: 5 # keep checking for healthyness every 5 seconds.
      readinessProbe: # checks if application is successfully able to fetch external db/api otherwise stop traffic from coming
        httpGet:
          path: /readyz 
          port: {{ .Values.workload.port }}
        # initialDelaySeconds: 15 # not needed for readinessProbe
        periodSeconds: 5 # every 5 second will hit to check
      envFrom:
        - configMapRef:
            name: {{ .Values.microservice.name }}-config
        - secretRef:
            name: {{ .Values.microservice.name }}-secret
      resources:
        requests: # minimum resource required to run the container
          memory: {{ .Values.workload.resources.memory }} 
          cpu: {{ .Values.workload.resources.cpu }}
        limits: # if dont give limit then all container would try to use as much resource as possible leading to OOM
          memory: {{ .Values.workload.resources.memory }}   # dont want to provide limit to cpu as we want to use as much cpu as possible for better performance
      ports:
        - containerPort: {{ .Values.workload.port }}

# so can delete the grade-submission-portal.yaml as this will manage the three pods with the instance name
# service remains as it will forward the traffic to one of the three pods.
