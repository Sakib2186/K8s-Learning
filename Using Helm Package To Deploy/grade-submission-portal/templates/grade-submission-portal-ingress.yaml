# delete namespace of ingress first
# kubectl delete namespace ingress-nginx
# ingress-nginx command
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml
# this install ingress-nginx controller
# check kubectl get pods -n ingress-nginx

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.microservice.name }}-ingress
  namespace: {{ .Values.microservice.namespace }}
spec:
  ingressClassName: nginx
  rules: # the ingress rules
  #- host: <Host> # the domain name, in productio keep this and give domain, for loal use http
  - http: # as host disbaled so i am enabling any host from any domain that has / at end to my backend service with the name provided for the cluster ip
      paths: 
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ .Values.microservice.name }}
            port: 
              number: {{ .Values.workload.port }}

