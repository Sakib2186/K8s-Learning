apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: grade-submission
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mongodb
  serviceName: mongodb ## mongodb-3 or mongodb-4. The numbering goes in ascending order.
  replicas: 2 # mongodb-0 mongodb-1 two stateful pods will be created. If one pod goes down, then the other pod will take over the traffic. Its better to keep only 1, and not 2 otherwise service/CLUSTERIP will roundrobin between 2 db, fetching wrong data.
  template: # pod template each replicas will be generated based on this template
    metadata:
      labels:
        app.kubernetes.io/name: grade-submission
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0.8
        # authentication
        envFrom:
        - secretRef:
            name: mongodb-secret
        ports:
        - containerPort: 27017 # mongdb deafault port. so need to expose this port to outside world. so container port is 270017
        volumeMounts: # PVC contenting to storage found by k8s in nodes.
        - name: mongodb-persistent-storage
          mountPath: /data/db
  volumeClaimTemplates: # Persistent volume claim template. since it has two replicas, so two PVC will be created. One binded to mongodb-0 and other binded to mongodb-1.
  - metadata:
      name: mongodb-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ] # only one pod can write to the volume at a time. But, multiple pods can read from the volume.
      resources:
        requests:
          storage: 1Gi

# mongodb-persistent-storage-mongodb-0
# mongodb-persistent-storage-mongodb-1


# IMPORTANT
# using we use helm repo to use existing repo of mongodb or postgres from Bitnami in to our local helm repo
# which is much secured

# Commands:
# helm repo add bitnami https://charts.bitnami.com/bitnami
# helm repo update

# to see all charts i have now access to
# helm search repo

# to view all of the version of a sepecfic chart and not the latest one
# helm search repo bitnami/mongodb --versions
# search on github bitnami/charts to see documentation of your desire chart

# to copy values from bitnami chart
# helm show values bitnami/mongodb > default_values.yaml # dont really need this, just for me to see whether all values are ok as per provided one
# then create your own values.yaml to override the ones from default
# no need the custom service, secret or statefulset as now gonna use helm bitnami repos one.

# once done with overriding values then install
# helm install mongodb bitnami/mongodb --version 15.6.13 -f values.yaml -n mongodb
# -f values.yaml tells to look at values.yaml to override

# as this is a stateful set so now can see using
# kubectl get statefulset mongofb -n mongodb